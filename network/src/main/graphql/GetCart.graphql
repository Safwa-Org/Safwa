query GetCart($cartId: ID!) {
  cart(id: $cartId) {
    id
    checkoutUrl
    
    discountCodes {
      code
      applicable
    }

    lines(first: 100) {
      edges {
        node {
          id
          quantity

          merchandise {
            ... on ProductVariant {
              id
              title

              product {
                title
                featuredImage {
                  url
                }
              }

              priceV2 {
                amount
                currencyCode
              }
            }
          }

          cost {
            totalAmount {
              amount
              currencyCode
            }
          }
        }
      }
    }

    cost {
      subtotalAmount {
        amount
        currencyCode
      }
      totalTaxAmount {
        amount
        currencyCode
      }
      totalAmount {
        amount
        currencyCode
      }
    }

    deliveryGroups(first: 10) {
      edges {
        node {
          deliveryOptions {
            title
            handle
            estimatedCost {
              amount
              currencyCode
            }
          }
        }
      }
    }
  }
}
