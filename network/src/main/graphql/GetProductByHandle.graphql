query GetProductByHandle($handle: String!) {
    product(handle: $handle) {
        id
        title
        handle
        description
        descriptionHtml
        vendor
        productType
        collections(first: 5) {
            edges {
                node {
                    id
                    title
                    handle
                }
            }
        }
        priceRange {
            minVariantPrice {
                amount
                currencyCode
            }
            maxVariantPrice {
                amount
                currencyCode
            }
        }
        images(first: 10) {
            edges {
                node {
                    id
                    url
                    altText
                    width
                    height
                }
            }
        }
        variants(first: 20) {
            edges {
                node {
                    id
                    title
                    availableForSale
                    selectedOptions {
                        name
                        value
                    }
                    price {
                        amount
                        currencyCode
                    }
                    quantityAvailable
                }
            }
        }
    }
}